<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ノンノンかカミナリたくみかクイズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="site-shell">
  <header class="site-header"><div class="site-kicker">★ NONNON or TAKUMI ★</div><div class="site-logo">ノンノンかカミナリたくみかクイズ</div><div class="site-sub">～ この発言、どっち？ ～</div></header>
  <nav class="site-nav">｜ HOME ｜ QUIZ ｜ PROFILE ｜ LINK ｜</nav>
  <section id="title" class="screen active">
    <div class="panel title-panel">
      <div class="panel-caption">★ NONNON or TAKUMI ★</div>
      <h1>ノンノンか<br>カミナリたくみかクイズ</h1>
      <p>この発言、どっち？</p>
      <button id="start">スタート</button>
    </div>
  </section>
  <section id="question" class="screen">
    <div class="status"><span id="qno"></span><span id="score"></span></div>
    <div class="questionbox" id="questionText"></div>
    <div class="character-row">
      <button class="character" data-answer="nonnon"><img src="images/nonnon.png" alt="ノンノン"><strong>ノンノン</strong></button>
      <button class="character" data-answer="takumi"><img src="images/takumi.png" alt="カミナリ 石田たくみ"><strong>カミナリ たくみ</strong></button>
    </div>
  </section>
  <section id="answer" class="screen">
    <div class="status answer-status"><span>ANSWER</span><span>正解発表</span></div>
    <div class="answerbox"><span>正解は…</span><div id="answerName" class="answer-name"></div><button id="next">次の問題へ &gt;</button></div>
    <div class="character-row answer-characters">
      <div class="character display-only"><img src="images/nonnon.png" alt="ノンノン"><strong>ノンノン</strong></div>
      <div class="character display-only"><img src="images/takumi.png" alt="カミナリ 石田たくみ"><strong>カミナリ たくみ</strong></div>
    </div>
  </section>
  <section id="result" class="screen">
    <div class="panel result-panel">
      <div class="panel-caption">★ 結果発表 ★</div>
      <div id="resultScore" class="result-score"></div>
      <p id="resultMessage"></p><button id="back">タイトルに戻る</button>
    </div>
  </section>
  <footer class="site-footer"><div>★ NONNON or TAKUMI QUIZ ★</div><div class="counter">あなたは <span>000001</span> 人目の挑戦者です</div><div>Last Update : 2026.10.07</div></footer>
</main>
<script src="quiz.js"></script>
</body></html>
